name: Build and publish kapylauncher

on:
  push:
    branches:
      - main
    tags:
      - "kapylauncher-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      KAPYLAUNCHER_MICROSOFT_CLIENT_ID: ${{ secrets.KAPYLAUNCHER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version and build Linux package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#kapylauncher-v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew --no-daemon -p composeApp -PappVersion="${VERSION}" test packageDeb
      - name: Stage Linux package
        shell: bash
        run: |
          mkdir -p dist
          PACKAGE="$(find composeApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "${PACKAGE}"
          cp "${PACKAGE}" dist/kapylauncher-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/kapylauncher-linux-amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      KAPYLAUNCHER_MICROSOFT_CLIENT_ID: ${{ secrets.KAPYLAUNCHER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version and build Windows package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^kapylauncher-v', ''
          } else {
            $version = "0.0.$($env:GITHUB_RUN_NUMBER)"
          }
          .\gradlew.bat --no-daemon -p composeApp "-PappVersion=$version" test packageMsi
      - name: Stage Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $package = Get-ChildItem "composeApp\build\compose\binaries\main\msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $package) { throw "The Windows MSI package was not produced" }
          Copy-Item $package.FullName "dist\kapylauncher-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/kapylauncher-windows-x64.msi
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    env:
      KAPYLAUNCHER_MICROSOFT_CLIENT_ID: ${{ secrets.KAPYLAUNCHER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version and build Apple Silicon package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#kapylauncher-v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew --no-daemon -p composeApp -PappVersion="${VERSION}" test packageDmg
      - name: Stage Apple Silicon package
        shell: bash
        run: |
          mkdir -p dist
          PACKAGE="$(find composeApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${PACKAGE}"
          cp "${PACKAGE}" dist/kapylauncher-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/kapylauncher-macos-arm64.dmg
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    env:
      KAPYLAUNCHER_MICROSOFT_CLIENT_ID: ${{ secrets.KAPYLAUNCHER_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version and build Intel package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#kapylauncher-v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew --no-daemon -p composeApp -PappVersion="${VERSION}" test packageDmg
      - name: Stage Intel package
        shell: bash
        run: |
          mkdir -p dist
          PACKAGE="$(find composeApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${PACKAGE}"
          cp "${PACKAGE}" dist/kapylauncher-macos-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/kapylauncher-macos-x64.dmg
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos-arm64, macos-intel]
    if: startsWith(github.ref, 'refs/tags/kapylauncher-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: kapylauncher ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
